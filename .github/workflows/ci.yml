name: CI Backend Quality & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Run Pytest & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite (Pytest)
        working-directory: ./backend
        env:
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock-key-for-ci"
          OPENAI_API_KEY: "mock-openai-key"
          API_KEY: "teste-api-key-secreta"
          WEBHOOK_SECRET: "teste-webhook-secret"
          EVOLUTION_API_KEY: "teste-evolution-key"
          EVOLUTION_API_URL: "https://mock.evolution.com"
          EVOLUTION_INSTANCE: "mock-instance"
          GRUPO_JID: "mock-grupo@g.us"
          AGENTE_JID: "mock-agente@s.whatsapp.net"
        run: |
          pytest -v --tb=short
