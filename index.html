
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVB - Aço Verde Brasil</title>
    <meta name="description" content="Sistema de Controle de Estoque e Ferramentaria" />
    <meta name="author" content="AVB" />
    <link rel="icon" href="/lovable-uploads/511430f2-a9a3-462b-8b72-decc865a19d6.png" type="image/png">

    <!-- Cache optimization hints -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000, immutable">
    
    <!-- DNS prefetch and preconnect for better performance -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    
    <!-- Preconnect to own domain to establish early connection -->
    <link rel="preconnect" href="/" crossorigin>
    
    <!-- Inline critical CSS to prevent render blocking -->
    <style>
      /* Critical CSS - Base Tailwind and layout styles */
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
      ::before,::after{--tw-content:''}
      html{line-height:1.5;-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal}
      body{margin:0;line-height:inherit}
      
      /* Design system colors - critical variables */
      :root {
        --background: 0 0% 98%;
        --foreground: 85 35% 15%;
        --card: 0 0% 100%;
        --card-foreground: 85 35% 15%;
        --primary: 144 20% 58%;
        --primary-foreground: 0 0% 100%;
        --secondary: 85 20% 85%;
        --secondary-foreground: 85 35% 15%;
        --muted: 85 15% 92%;
        --muted-foreground: 85 15% 45%;
        --border: 214.3 31.8% 91.4%;
        --ring: 222.2 84% 4.9%;
        --radius: 0.5rem;
      }
      
      /* Critical layout styles */
      body { 
        background-color: hsl(var(--background)); 
        color: hsl(var(--foreground));
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Hide content until full CSS loads to prevent FOUC */
      .app-loading {
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
      }
      
      .app-loaded {
        opacity: 1;
      }
      
      /* Additional critical styles to prevent layout shift */
      .container {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      
      .flex {
        display: flex;
      }
      
      .flex-col {
        flex-direction: column;
      }
      
      .items-center {
        align-items: center;
      }
      
      .justify-center {
        justify-content: center;
      }
      
      .min-h-screen {
        min-height: 100vh;
      }
      
      .text-center {
        text-align: center;
      }
      
      .space-y-4 > :not([hidden]) ~ :not([hidden]) {
        --tw-space-y-reverse: 0;
        margin-top: calc(1rem * calc(1 - var(--tw-space-y-reverse)));
        margin-bottom: calc(1rem * var(--tw-space-y-reverse));
      }
      
      .bg-primary {
        background-color: hsl(var(--primary));
      }
      
      .text-primary-foreground {
        color: hsl(var(--primary-foreground));
      }
      
      .px-4 {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      
      .py-2 {
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }
      
      .rounded {
        border-radius: 0.25rem;
      }
    </style>

    <!-- Async CSS loading with fallback -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet';document.documentElement.classList.add('app-loaded')" fetchpriority="low">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>

    <!-- Preload critical JavaScript with high priority and cache hints -->
    <link rel="modulepreload" href="/src/main.tsx" fetchpriority="high">
    <link rel="modulepreload" href="/src/App.tsx" fetchpriority="high">
    <link rel="modulepreload" href="/src/pages/Index.tsx" fetchpriority="high">
    
    <!-- Preload React and other critical dependencies with cache optimization -->
    <link rel="preload" href="/node_modules/react/index.js" as="script" crossorigin>
    <link rel="preload" href="/node_modules/react-dom/index.js" as="script" crossorigin>

    <meta property="og:title" content="AVB - Aço Verde Brasil" />
    <meta property="og:description" content="Sistema de Controle de Estoque e Ferramentaria" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/lovable-uploads/f0658b43-9477-48a1-9a25-be17050c413e.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@avb_dev" />
    <meta name="twitter:image" content="/lovable-uploads/f0658b43-9477-48a1-9a25-be17050c413e.png" />

    <script>
      // Add loading class initially, will be removed when CSS loads
      document.documentElement.classList.add('app-loading');
      
      // Fallback CSS loader in case preload fails
      (function() {
        var cssLoaded = false;
        var checkCSS = function() {
          if (!cssLoaded) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = '/src/index.css';
            link.onload = function() {
              document.documentElement.classList.add('app-loaded');
            };
            document.head.appendChild(link);
            cssLoaded = true;
          }
        };
        
        // Check if CSS loaded after 100ms
        setTimeout(checkCSS, 100);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
